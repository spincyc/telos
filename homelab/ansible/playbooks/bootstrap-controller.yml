---
# Converge the temporary host-level domain controller. The private inventory
# owns every identity value. First provisioning remains a separate explicit
# opt-in inside roles/domain_controller.
#
# This is the ONE play that carries the domain_controller role, so it is also
# the only wired path to the durable directory accounts. `bootstrap_controllers`
# is the group the in-guest factory inventory declares
# (homelab/vm/controller_factory.py) and it must exist in the private inventory
# too: an inventory that does not define it makes this play match zero hosts,
# which Ansible reports as a WARNING and not as a failure. Declare it there as a
# parent of `controllers` -- see homelab/instance-example/inventory/hosts.yml --
# so the Controller is in both groups and group_vars/controllers.yml, which
# holds every AD variable, applies to it.
- name: Converge the isolated bootstrap Controller
  hosts: bootstrap_controllers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Read the installation manifest
      ansible.builtin.slurp:
        src: /etc/homelab/manifest.json
      register: homelab_manifest_raw

    - name: Parse the manifest
      ansible.builtin.set_fact:
        homelab_manifest: "{{ homelab_manifest_raw.content | b64decode | from_json }}"

    - name: Refuse a non-Controller host
      ansible.builtin.assert:
        that:
          - homelab_manifest.profile == 'controller'
          - homelab_manifest.hostname == ansible_hostname
        fail_msg: >-
          Refusing {{ inventory_hostname }}: its signed-off installation
          identity does not match this Controller host.

  roles:
    - role: domain_controller
