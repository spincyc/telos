---
# ADR 0055: Samba AD DC is the directory. This role makes a machine a *client*
# of it. The domain controller itself is built separately and is not converged
# from here -- it is a distinct trust boundary running in its own VM.
#
# Disabled by default. Joining a machine to a directory that is not ready yet
# is how a working machine stops being able to log in.
#
# DERIVED, not declared, and from the SAME declaration roles/domain_controller
# provisions the directory from: ADR 0065's permanent identity, in the owner's
# gitignored homelab/instance/identity/directory.json. The realm below is
# rendered into every client's krb5.conf and sssd.conf and the NetBIOS name
# into its smb.conf workgroup, so a client built against a different realm than
# the Controller was provisioned under fails at the first login -- after the
# expensive part, and against a realm ADR 0065 records as effectively
# permanent. The `directory_identity` dependency resolves both families in one
# invocation and refuses any disagreement by name, so they cannot diverge.
#
# With no such document nothing is derived and the first task below keeps
# requiring them, exactly as before.
homelab_identity_domain: ""
homelab_identity_realm: ""
homelab_identity_netbios_domain: ""

# The fully qualified name of the domain controller SSSD should talk to, e.g.
# "dc1.example.test". Where a permanent-identity document exists this must be
# one of the two Controllers ADR 0065 froze -- services.bootstrap_dc_fqdn or
# services.permanent_dc_fqdn -- and naming a third is refused, because
# ad_server must name a controller the domain actually publishes. It is NOT
# derived: which of the two a client should pin is a migration decision the
# owner makes, not a value the document answers.
#
# Empty means fall back to DNS SRV service discovery, which
# is correct for a site with several controllers -- but SSSD's AD provider has
# NO other way to find one, while Samba's `net ads` can fall back to a NetBIOS
# broadcast. A join that verifies therefore proves nothing about whether SSSD
# can discover the same controller, and the gate-8 run of 2026-08-14 hit exactly
# that gap. Name the controller wherever there is one to name. The real value
# lives in the gitignored instance overlay (ADR 0046); the factory installer
# (workstations/arch_second.py) sets its own synthetic equivalent.
homelab_identity_domain_controller: ""

# ADR 0071 permits indefinite cached logon for machines away at college.
# SSSD defines zero as no expiration; keep the value explicit so a package
# default cannot silently shorten the offline lifetime.
homelab_identity_offline_credentials_expiration_days: 0

# How long a machine whose backend went offline waits before retesting the
# directory, and the ceiling that doubling climbs to. SSSD's own defaults are
# 60 and 3600, which leaves a reconnecting machine blind for up to an hour; a
# live gate-8 run measured 69 seconds and its recovery proof gave up seven
# seconds early. The 4x ratio between them is the one sssd.conf(5) asks for.
homelab_identity_offline_timeout_seconds: 5
homelab_identity_offline_timeout_max_seconds: 20

# The directory owns UID and GID. Enumeration is off because it makes every
# `ls -l` a directory query.
homelab_identity_enumerate: false
