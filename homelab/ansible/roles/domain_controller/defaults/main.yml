---
# Stable client-facing identity (ADR 0065). Changing these values after
# provisioning is a directory migration, not an Ansible convergence.
#
# DERIVED, not declared. These four stay empty here and the role's
# `directory_identity` dependency fills them in from the ONE place ADR 0065's
# permanent values are declared -- the owner's gitignored
# homelab/instance/identity/directory.json -- which
# homelab/vm/directory_identity.py is the one loader for and which the
# simulated persistent Controller is converged from over its serial console.
# An inventory that also sets one of them, to a DIFFERENT value, is refused by
# name, quoting both values and naming both files; setting one to the SAME
# value is merely redundant.
#
# With NO such document nothing is derived, the first task below keeps
# requiring them exactly as it always did, and no fallback is invented. That is
# deliberate and load-bearing: the disposable acceptance Controller has no
# document and takes every one of these from the factory bundle's
# factory-vars.json (homelab/vm/controller_factory.py), which is how gates 3
# through 12 converge a throwaway domain under ad.factory.test.
homelab_ad_dns_domain: ""
homelab_ad_realm: ""
homelab_ad_netbios_domain: ""
homelab_ad_server_role: dc
homelab_ad_dns_backend: SAMBA_INTERNAL
homelab_ad_provision_enabled: false
# The Controller's own SHORT name. Also derived: with a permanent-identity
# document present this is whichever of services.bootstrap_dc_fqdn and
# services.permanent_dc_fqdn this machine actually is, and a machine that is
# neither is refused before anything is installed. An inventory value that
# names a third machine is refused by the resolver.
homelab_ad_expected_hostname: ""

# First provisioning is the sole task that needs the initial Administrator
# password. The operator places this root-owned 0600 file on the target (a
# /run path is preferable) and removes it after the first successful run.
# Ansible never copies, reads, logs, or retains its contents.
homelab_ad_admin_password_file: ""

homelab_ad_smb_conf: /etc/samba/smb.conf
homelab_ad_private_dir: /var/lib/samba/private
homelab_ad_enable_rfc2307: true
homelab_ad_ntp_upstreams:
  - 0.arch.pool.ntp.org
  - 1.arch.pool.ntp.org
homelab_ad_development_clock_receipt_file: ""
homelab_ad_manage_packages: true

# The control-host cache is verified during acquisition and again by the
# factory-media seal. FactoryBundle overrides this path with its verified
# two-file copy. An absent repair is an error, never a silent fallback to
# compressed SRV targets that strict clients cannot consume.
homelab_ad_dns_repair_source: "{{ role_path }}/../../../var/media/samba-dns"

# Documentation/input for the surrounding firewall role. This role does not
# guess which firewall owns the host or network policy.
homelab_ad_tcp_ports:
  - 53
  - 88
  - 135
  - 139
  - 389
  - 445
  - 464
  - 636
  - 3268
  - 3269
homelab_ad_udp_ports:
  - 53
  - 88
  - 123
  - 137
  - 138
  - 389
  - 464
homelab_ad_rpc_dynamic_tcp_range: 49152-65535

# Gate 9: optional per-user UNAS SMB storage. The authority name gets its own
# DNS label so acceptance can toggle reachability in DNS alone; an empty
# address skips publication.
homelab_storage_host_label: unas
homelab_storage_address: ""

# Durable directory accounts for a PERSISTENT instance (ADR 0055).
#
# This list does NOT name accounts. Real account names are instance data
# (ADR 0046) and are declared exactly once, in the owner's gitignored private
# overlay:
#
#     homelab/instance/identity/principals.json
#
# which homelab/workstations/arch_second.identity_roster resolves against the
# tracked identity-lifecycle contract, and which also names the accounts baked
# onto an installed workstation disk. This list only says WHICH of the
# contract's directory roles this instance keeps as durable directory accounts:
#
#   homelab_ad_directory_accounts:
#     - standard_user
#     - daily_administrator
#     - domain_administrator
#
# Order is immaterial. The UID belongs to the ROLE, not to the position in this
# list and not to the account's name (see the allocation note below), so
# renaming an account in the overlay moves no UID and adding a role appends one.
#
# The overlay's `additional_standard_users` -- durable-only standard accounts
# with no contract role -- are not listed here. Whenever this list is non-empty
# the role plans every one the overlay declares, as a plain standard account
# (never Domain Admins), and requires the plan to hold exactly these roles plus
# exactly those users.
#
# `local_rescue` is refused outright: ADR 0055/0063 keep the break-glass
# administrator a LOCAL account at UID 1000 on the workstation, never a
# directory principal.
#
# Empty by default, and every task that acts on it is gated on it being
# non-empty, so a run that declares nothing behaves exactly as this role did
# before durable accounts existed. That is deliberate: the disposable
# acceptance Controller must stay untouched, because its roster is synthetic,
# per-run, and staged much later over the serial console by
# homelab/vm/controller_principals.py.
#
# This role is never given a password value, only the path of a root-owned
# 0600 file that already exists on the target. An account that already exists
# is left alone: its password, its SID and its group memberships survive
# re-convergence, which is the whole point of a persistent instance.
homelab_ad_directory_accounts: []

# The POSIX allocation rule lives in exactly one place, and it is not here:
#
#     homelab/vm/controller_principals.directory_account_plan
#
#   users:  uidNumber = the private overlay's uid_number pin for the role,
#           else POSIX_BASE + the role's position in
#           arch_second.DIRECTORY_ROLES; an additional standard user carries
#           its own required uid_number
#   groups: gidNumber = POSIX_BASE + the group's well-known AD RID
#
# The same function serves the disposable acceptance roster, so the workstation
# can never be handed different UIDs than the acceptance path proves and file
# ownership under the per-user share root cannot break. This role does not
# restate the arithmetic and holds no base: its variables are rendered on the
# Ansible CONTROL HOST by files/resolve-directory-accounts.py, because the
# in-guest driver has only homelab/ansible staged and must not be given the
# owner's private identity overlay.
#
# The two values below are declared here because the role itself uses them --
# the privilege group is the one it asks `samba-tool group listmembers` about,
# and the RID map is the set of groups it requires to carry a gidNumber. The
# resolver refuses to render a plan if either disagrees with the allocation
# above; it never derives a number from them.
homelab_ad_posix_admin_group: Domain Admins
homelab_ad_posix_group_rids:
  Domain Users: 513
  Domain Admins: 512

# Where each durable account's initial credential is staged on the target, as a
# PATH TEMPLATE, never a value. `{name}` is replaced with the account's own
# resolved name, so the owner never restates a name here either. The file must
# be a root-owned 0600 regular file with a non-empty first line, and is only
# required for an account the directory does not have yet: delete it afterwards.
homelab_ad_account_password_file_template: /run/secrets/homelab-ad-{name}

# A password already set in the directory is never rewritten. Rotation takes
# two keys: this switch, and naming the CONTRACT ROLE (not the account) below
# -- or, for an additional standard user from the overlay, which has no role,
# its `additional_standard_user_<uidNumber>` label. Return both to their
# defaults immediately afterwards, exactly as with first provisioning.
homelab_ad_account_password_reset_enabled: false
homelab_ad_account_password_reset_roles: []

# Where the durable account driver writes its own bounded, credential-redacted
# diagnostic on the target, and where the role reads it back from when the
# driver fails. Declared once because two literals that must agree is how a
# failure ends up reported as "(censored due to no_log)" and nothing else. It
# names no account: the driver reports contract roles, never names.
homelab_ad_account_diagnostic_file: /run/homelab-provision-accounts.status

# An account the directory already holds keeps the uidNumber it was allocated.
# Convergence refuses to move it, because everything that account owns -- files
# on every workstation, its per-user share directory, every ACL keyed on its
# POSIX identity -- is keyed on that number and nothing here can follow it.
# Setting this true for one deliberate run is a migration, not a convergence.
homelab_ad_account_renumber_enabled: false

# Where the per-user [homes] share directories live, declared ONCE. The
# `[homes]` service this role exports serves `<root>/%S`, the task that verifies
# that service compares against this same value, and each durable account's own
# private directory is created under it. Until 2026-08-17 this variable was a
# decoy: the three places that needed it each restated `/srv/unas` instead, so
# changing it changed nothing.
#
# homelab/vm/controller_principals.py creates and chowns the same root for the
# disposable acceptance roster and holds its own literal, so overriding this is
# a persistent-instance storage decision only -- it would break gate 9 on the
# acceptance path, and on a persistent instance the existing per-user
# directories have to be moved with it.
homelab_ad_share_root: /srv/unas

# The directory account the role resolves through its own name service to prove
# smbd can clone the per-user [homes] share for a domain user. It must be an
# account that already exists at convergence time, which the built-in domain
# administrator is and the acceptance principals are not: they are staged much
# later over the Controller serial. Override it only if the built-in account has
# been renamed.
homelab_ad_nss_probe_principal: Administrator
