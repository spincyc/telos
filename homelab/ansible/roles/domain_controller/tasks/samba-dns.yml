---
# Samba 4.24.5 compresses SRV Target despite RFC 2782/3597. Modern c-ares
# rejects that encoding; an old fixed-DC fallback hid the defect until native
# restore renamed the Controller. Keep Samba internal DNS and repair only its
# NDR library. The original package files remain available for hash checks.
- name: Create the Samba DNS repair and helper directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /usr/local/lib/telos/samba-dns
    - /usr/local/libexec
    - /etc/systemd/system/samba.service.d

- name: Install the verified Samba DNS repair artifact
  ansible.builtin.copy:
    src: "{{ homelab_ad_dns_repair_source }}/{{ item }}"
    dest: "/usr/local/lib/telos/samba-dns/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - libndr-nbt.so.0
    - receipt.json
  notify: restart samba ad dc

- name: Install the Samba DNS compatibility guard
  ansible.builtin.copy:
    src: verify-samba-dns-library.py
    dest: /usr/local/libexec/homelab-verify-samba-dns-library
    owner: root
    group: root
    mode: "0755"
  notify: restart samba ad dc

- name: Require the repair to match the installed Samba packages
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - /usr/local/libexec/homelab-verify-samba-dns-library
      - --directory
      - /usr/local/lib/telos/samba-dns
  changed_when: false

- name: Scope the repaired DNS library to Samba and guard every start
  ansible.builtin.copy:
    dest: /etc/systemd/system/samba.service.d/telos-dns.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      Environment=LD_LIBRARY_PATH=/usr/local/lib/telos/samba-dns
      ExecStartPre=/usr/bin/python3 /usr/local/libexec/homelab-verify-samba-dns-library --directory /usr/local/lib/telos/samba-dns
  notify: restart samba ad dc

- name: Install the DNS service discovery wire check
  ansible.builtin.copy:
    src: verify-dns-srv.py
    dest: /usr/local/libexec/homelab-verify-dns-srv
    owner: root
    group: root
    mode: "0755"
