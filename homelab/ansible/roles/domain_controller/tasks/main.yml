---
- name: Validate the permanent directory identity
  ansible.builtin.assert:
    that:
      - homelab_ad_dns_domain | length > 0
      - homelab_ad_realm | length > 0
      - homelab_ad_netbios_domain | length > 0
      - homelab_ad_expected_hostname | length > 0
      - ansible_hostname == homelab_ad_expected_hostname
      - ansible_fqdn == homelab_ad_expected_hostname ~ '.' ~ homelab_ad_dns_domain
      - homelab_ad_dns_domain == (homelab_ad_dns_domain | lower)
      - homelab_ad_realm == (homelab_ad_dns_domain | upper)
      - homelab_ad_netbios_domain == (homelab_ad_netbios_domain | upper)
      - homelab_ad_netbios_domain | length <= 15
      - homelab_ad_server_role == 'dc'
      - homelab_ad_dns_backend == 'SAMBA_INTERNAL'
    fail_msg: >-
      Refusing to provision an ambiguous AD identity. The DNS domain must be
      lower case, the realm its upper-case equivalent, and the NetBIOS domain
      upper case and no longer than 15 characters.

- name: Resolve the permanent Controller name before mutation
  ansible.builtin.command:
    argv:
      - /usr/bin/getent
      - ahostsv4
      - "{{ homelab_ad_expected_hostname }}.{{ homelab_ad_dns_domain }}"
  register: homelab_ad_name_resolution
  changed_when: false
  check_mode: false

- name: Inspect clock synchronization before mutation
  ansible.builtin.command:
    argv:
      - /usr/bin/timedatectl
      - show
      - --property=NTPSynchronized
      - --value
  register: homelab_ad_clock_sync
  changed_when: false
  check_mode: false

- name: Inspect an optional external clock-verification receipt
  ansible.builtin.stat:
    path: "{{ homelab_ad_development_clock_receipt_file }}"
  register: homelab_ad_clock_receipt
  when: homelab_ad_development_clock_receipt_file | length > 0

- name: Require working name resolution and synchronized time
  ansible.builtin.assert:
    that:
      - homelab_ad_name_resolution.stdout | trim | length > 0
      - >-
        (homelab_ad_clock_sync.stdout | trim == 'yes') or
        (
          homelab_manifest.development_proof | default(false) | bool and
          homelab_ad_development_clock_receipt_file | length > 0 and
          homelab_ad_clock_receipt.stat.exists and
          homelab_ad_clock_receipt.stat.isreg and
          homelab_ad_clock_receipt.stat.uid == 0 and
          homelab_ad_clock_receipt.stat.mode == '0600' and
          homelab_ad_clock_receipt.stat.size > 0
        )
    fail_msg: >-
      Refusing AD convergence before mutation. The permanent Controller FQDN
      must resolve on this host and time must be synchronized or carry a
      root-owned 0600 verification receipt from a bounded external check.

- name: Report a successful non-mutating Controller preflight
  ansible.builtin.debug:
    msg: >-
      Controller identity, FQDN resolution, and clock synchronization passed.
      Check mode stops here because package and first-domain state cannot be
      validated safely before those changes exist.
  when: ansible_check_mode

- name: Stop after the useful check-mode preflight
  ansible.builtin.meta: end_host
  when: ansible_check_mode

- name: Check for an existing directory database
  ansible.builtin.stat:
    path: "{{ homelab_ad_private_dir }}/sam.ldb"
  register: homelab_ad_database

- name: Check for a pre-existing Samba configuration
  ansible.builtin.stat:
    path: "{{ homelab_ad_smb_conf }}"
  register: homelab_ad_existing_smb_conf
  when: not homelab_ad_database.stat.exists

- name: Refuse to overwrite an unexplained Samba configuration
  ansible.builtin.assert:
    that: not homelab_ad_existing_smb_conf.stat.exists
    fail_msg: >-
      {{ homelab_ad_smb_conf }} exists but no AD database exists. Inspect and
      remove or archive that file deliberately; first-DC provisioning will not
      overwrite an unexplained Samba configuration.
  when: not homelab_ad_database.stat.exists

- name: Inspect the one-time password file
  ansible.builtin.stat:
    path: "{{ homelab_ad_admin_password_file }}"
  register: homelab_ad_password
  when: not homelab_ad_database.stat.exists
  no_log: true

- name: Require explicit authorization for first provisioning
  ansible.builtin.assert:
    that: homelab_ad_provision_enabled | bool
    fail_msg: >-
      No directory exists. Set homelab_ad_provision_enabled=true for the
      deliberate first provisioning run; return it to false immediately
      afterwards.
  when: not homelab_ad_database.stat.exists

- name: Require a protected one-time password file
  ansible.builtin.assert:
    that:
      - homelab_ad_admin_password_file | length > 0
      - homelab_ad_password.stat.exists
      - homelab_ad_password.stat.isreg
      - homelab_ad_password.stat.uid == 0
      - homelab_ad_password.stat.mode == '0600'
      - homelab_ad_password.stat.size > 0
    fail_msg: >-
      First provisioning requires a root-owned 0600 password file already on
      the target. Prefer /run/secrets/samba-ad-admin; do not put the password
      in inventory, Git, an Ansible variable, or the command line.
  when: not homelab_ad_database.stat.exists
  no_log: true

- name: Install Samba AD dependencies
  ansible.builtin.package:
    name:
      - samba
      - krb5
      - ntp
      - python-cryptography
      - python-dnspython
      - python-markdown
      - openresolv
      - bind
      - glibc
    state: present
  when: homelab_ad_manage_packages | bool

- name: Stop incompatible Samba member services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - smb.service
    - nmb.service
    - winbind.service
  failed_when: false

- name: Provision with an ephemeral credential feeder
  when: not homelab_ad_database.stat.exists
  block:
    - name: Create the local helper directory
      ansible.builtin.file:
        path: /usr/local/libexec
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the one-time provisioning driver
      ansible.builtin.copy:
        src: provision-domain.py
        dest: /usr/local/libexec/homelab-provision-domain
        owner: root
        group: root
        mode: "0700"

    - name: Provision the first domain controller
      # The driver answers samba-tool's terminal prompt from the protected file.
      # The password therefore enters neither Ansible data nor a process argv.
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/homelab-provision-domain
          - --password-file
          - "{{ homelab_ad_admin_password_file }}"
          - --realm
          - "{{ homelab_ad_realm }}"
          - --domain
          - "{{ homelab_ad_netbios_domain }}"
          - --server-role
          - "{{ homelab_ad_server_role }}"
          - --dns-backend
          - "{{ homelab_ad_dns_backend }}"
          - --diagnostic-file
          - /run/homelab-provision-domain.status
          - "{{ '--use-rfc2307' if homelab_ad_enable_rfc2307 else '--without-rfc2307' }}"
      no_log: true
      notify: restart samba ad dc
  always:
    - name: Remove the one-time provisioning driver
      ansible.builtin.file:
        path: /usr/local/libexec/homelab-provision-domain
        state: absent

- name: Install the domain Kerberos client configuration
  ansible.builtin.copy:
    src: "{{ homelab_ad_private_dir }}/krb5.conf"
    dest: /etc/krb5.conf
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  notify: restart samba ad dc

- name: Enable the Samba AD DC
  ansible.builtin.systemd:
    name: samba.service
    enabled: true
    state: started

- name: Map directory rfc2307 identifiers into DC file access
  # Without this smbd maps SIDs through idmap.ldb allocation and the staged
  # uidNumber-owned share directories would be unreadable by their owners.
  ansible.builtin.lineinfile:
    path: "{{ homelab_ad_smb_conf }}"
    insertafter: '^\[global\]'
    regexp: '^\s*idmap_ldb:use rfc2307'
    line: "        idmap_ldb:use rfc2307 = yes"
  when: homelab_ad_enable_rfc2307 | bool
  notify: restart samba ad dc

- name: Create the optional per-user UNAS share root
  ansible.builtin.file:
    path: /srv/unas
    state: directory
    owner: root
    group: root
    mode: "0711"

- name: Export optional per-user UNAS home shares
  ansible.builtin.blockinfile:
    path: "{{ homelab_ad_smb_conf }}"
    marker: "# {mark} TELOS OPTIONAL PER-USER UNAS SHARES (gate 9)"
    prepend_newline: true
    block: |
      [homes]
          path = /srv/unas/%S
          read only = no
          browseable = no
          valid users = %S
  notify: restart samba ad dc

- name: Resolve directory identities in the Controller's own name service
  # smbd only resolves //<server>/<name> through [homes] by looking <name> up
  # as a user ON THIS HOST.  smb.conf(5) states it plainly: when no explicit
  # section matches, "the requested section name is treated as a username and
  # looked up in the local password file", and the clone is refused outright
  # when that lookup returns nothing.  On an AD DC the domain accounts are not
  # local accounts, so with no directory source in nsswitch.conf
  # getpwnam("operator") misses, find_service() gives up, and smbd answers the
  # tree connect with STATUS_BAD_NETWORK_NAME.
  #
  # The 2026-08-14 gate-8 run is why this task exists.  Both reachable-storage
  # checks failed with "mount error(2): No such file or directory" and
  # "CIFS: VFS: cifs_mount failed w/return code = -2" *after the session had
  # already authenticated*: the client held a TGT, this KDC issued
  # cifs/unas.<domain> (kvno = 1, the alias SPN registered below), the
  # cifs.spnego upcall helper and its request-key rule were both in place, the
  # name resolved, and SSSD reported Online.  -2 is ENOENT, which on an
  # authenticated CIFS session is the server reporting a bad network name --
  # the share `operator` did not exist as far as smbd was concerned.  Arch
  # ships `passwd: files systemd`, and nothing in this repository had ever
  # given this host any way to see a domain user.
  #
  # winbind goes LAST so /etc/passwd and nss-systemd still answer first: a
  # local account can never be shadowed by a directory account of the same
  # name, and only a lookup miss costs a socket round trip.  What serves it is
  # the AD DC's own internal winbindd inside samba.service -- winbind.service
  # is the domain-member daemon, must not run on a DC, and stays stopped.
  #
  # Samba is restarted because glibc reads nsswitch.conf once per process: an
  # smbd started before this edit would keep the old database list and the
  # share would stay unresolvable until something else happened to restart it.
  ansible.builtin.lineinfile:
    path: /etc/nsswitch.conf
    backrefs: true
    regexp: '^({{ item }}:(?!.*\bwinbind\b).*)$'
    line: '\1 winbind'
  loop:
    - passwd
    - group
  notify: restart samba ad dc

- name: Require both Controller identity databases to consult the directory
  # backrefs makes a regexp that matches nothing a silent no-op, so the edit
  # above is proven rather than assumed: an nsswitch.conf whose passwd or group
  # line this role cannot recognise fails convergence here instead of
  # resurfacing as an unresolvable share in a guest serial log twenty minutes
  # later.  grep exits non-zero when the source is absent, so this is
  # fail-closed by construction.
  ansible.builtin.command:
    argv:
      - /usr/bin/grep
      - -Eq
      # POSIX ERE only: `$` stays outside every group, so this does not lean on
      # a GNU extension inside the alternation.
      - "^{{ item }}:.*[[:space:]]winbind([[:space:]].*)?$"
      - /etc/nsswitch.conf
  loop:
    - passwd
    - group
  changed_when: false

- name: Present directory identities unqualified to the Controller
  # The other half of the same [homes] lookup.  winbindd's default name form is
  # DOMAIN\user, so getpwnam("operator") would still miss even with the
  # database in place, while a client mounting //unas/operator can only ever
  # send the bare account name.  It also makes `valid users = %S` compare the
  # bare share name against the bare connecting name, which is what keeps the
  # foreign-share refusal a genuine authorization decision instead of a name
  # mismatch that would refuse the owner too.
  #
  # Deliberately NOT paired with `winbind nss info = rfc2307`: [homes] also
  # needs a non-empty home-directory field, and the default `template homedir`
  # supplies one for every domain account, whereas rfc2307 would supply one
  # only for accounts that carry unixHomeDirectory.  The served path stays
  # `path = /srv/unas/%S` either way, so where the share lives is independent
  # of the login home the directory hands SSSD (/home/<user>).  That
  # independence is why [homes] is the right mechanism and an explicitly named
  # share is not: the share name must be the account name, and this role is
  # never told the roster -- the disposable principals are staged later, over
  # the Controller serial, by homelab/vm/controller_principals.py.
  ansible.builtin.lineinfile:
    path: "{{ homelab_ad_smb_conf }}"
    insertafter: '^\[global\]'
    regexp: '^\s*winbind use default domain'
    line: "        winbind use default domain = yes"
  notify: restart samba ad dc

- name: Register the storage authority name as a Kerberos service alias
  # A Kerberos SMB client asks the KDC for a service ticket named after the UNC
  # host it was handed, so an A record alone cannot make this share mountable
  # with sec=krb5: `unas` is an ALIAS for this DC, and with no matching
  # servicePrincipalName the KDC answers S_PRINCIPAL_UNKNOWN, the client's
  # cifs.spnego upcall fails, and request_key(2) negates the key with -ENOKEY.
  #
  # The 2026-08-14 gate-8 run is why this task exists.  Both reachable-storage
  # checks failed with the kernel's "Verify user has a krb5 ticket and keyutils
  # is installed" and "Send error in SessSetup = -126" -- -126 is -ENOKEY --
  # while the share, the rfc2307 idmap, the A record and the client's own
  # closure were all correct.  Nothing in this role or in the workstation
  # install ever registered an SPN for the alias, and Samba's provisioning
  # registers only the DC's own names (HOST/<dc>.<domain>, HOST/<NETBIOS>).
  #
  # The alias SPNs go on this DC's own computer account, so the ticket the KDC
  # issues is encrypted with the very machine key smbd already accepts with; no
  # second account and no second keytab.  `cifs/` is the class mount.cifs asks
  # for; `host/` is registered alongside it because AD's default sPNMappings
  # (`host=...,cifs,...` in Samba's own provision_configuration.ldif) expands
  # the host class to every other service class on the same alias, which keeps
  # the alias usable by anything else without another directory change.
  ansible.builtin.command:
    argv:
      - /usr/bin/samba-tool
      - spn
      - add
      - "{{ item }}/{{ homelab_storage_host_label }}.{{
        homelab_ad_dns_domain }}"
      - "{{ homelab_ad_expected_hostname }}$"
  loop:
    - cifs
    - host
  register: homelab_unas_spn
  changed_when: homelab_unas_spn.rc == 0
  # samba-tool refuses an SPN it already holds ("Service principal ... already
  # affected to ..."), which is convergence, not a failure.
  failed_when: >-
    homelab_unas_spn.rc != 0 and
    'already' not in
    ((homelab_unas_spn.stderr | default('')) ~
     (homelab_unas_spn.stdout | default('')))
  when: homelab_storage_address | length > 0

- name: Apply share changes before publishing the storage name
  ansible.builtin.meta: flush_handlers

- name: Verify the per-user share exists as a service with the staged path
  # Proves the blockinfile above became a real service section with the path
  # the staged per-user directories actually live under, rather than a comment
  # block that happened to parse.  Runs after the flush, so this is the same
  # file the restarted daemon just loaded.  Fail-closed: testparm exits
  # non-zero on an unknown section, and a path that is not /srv/unas/%S would
  # serve somewhere the share owner does not own.
  ansible.builtin.command:
    argv:
      - /usr/bin/testparm
      - --suppress-prompt
      - --section-name=homes
      - --parameter-name=path
  register: homelab_unas_share_path
  changed_when: false
  failed_when: >-
    homelab_unas_share_path.rc != 0 or
    '/srv/unas/%S' not in homelab_unas_share_path.stdout

- name: Verify the Controller resolves an unqualified directory identity
  # The check the 2026-08-14 gate-8 failure had nowhere to fail: [homes] can
  # only clone a share for a name this host can resolve to a passwd entry, and
  # nothing anywhere asked whether it could.  Asked with the built-in domain
  # administrator because it is the one directory account that exists at
  # convergence time -- the acceptance principals are staged much later -- and
  # the property is the name service itself, not any particular account.
  #
  # Bounded retries rather than a single shot: the samba restart above takes the
  # internal winbindd down with it, and a lookup issued in that window would
  # fail for a reason that is not a defect.
  ansible.builtin.command:
    argv:
      - /usr/bin/getent
      - passwd
      - "{{ homelab_ad_nss_probe_principal }}"
  register: homelab_ad_nss_probe
  changed_when: false
  until: homelab_ad_nss_probe.rc == 0
  retries: 12
  delay: 5

- name: Require a home-directory field the per-user share can clone from
  # smbd reads pw_dir before it clones [homes] and refuses the clone when that
  # field is empty, even though the served path comes from `path = /srv/unas/%S`
  # and not from pw_dir.  A passwd entry alone is therefore not enough, so the
  # field is asserted rather than assumed.  Counted from the end because a
  # directory display name may legally contain a colon and the GECOS field
  # would then shift every earlier index; home directory and shell cannot.
  ansible.builtin.assert:
    that:
      - homelab_ad_nss_probe.stdout_lines | length >= 1
      - homelab_ad_nss_probe.stdout_lines[0].split(':') | length >= 7
      - homelab_ad_nss_probe.stdout_lines[0].split(':')[-2] | length > 0
    fail_msg: >-
      {{ homelab_ad_nss_probe_principal }} resolves on this Controller but
      without a usable home-directory field, so smbd cannot clone the [homes]
      section and every //{{ homelab_storage_host_label }}/<user> mount will be
      refused with a bad network name. Check `winbind nss info` and
      `template homedir`.

- name: Publish the storage authority name in domain DNS
  ansible.builtin.command:
    argv:
      - /usr/bin/samba-tool
      - dns
      - add
      - "127.0.0.1"
      - "{{ homelab_ad_dns_domain }}"
      - "{{ homelab_storage_host_label }}"
      - A
      - "{{ homelab_storage_address }}"
      - -P
  register: homelab_unas_dns
  changed_when: homelab_unas_dns.rc == 0
  failed_when: >-
    homelab_unas_dns.rc != 0 and
    'already exists' not in
    ((homelab_unas_dns.stderr | default('')) ~
     (homelab_unas_dns.stdout | default('')))
  when: homelab_storage_address | length > 0

- name: Configure authenticated domain time
  ansible.builtin.template:
    src: ntp.conf.j2
    dest: /etc/ntp.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart ntpd

- name: Allow ntpd to reach the Samba signing socket
  ansible.builtin.file:
    path: "{{ homelab_ad_private_dir }}/ntp_signd"
    owner: root
    group: ntp
    mode: "0750"
    state: directory
  notify: restart ntpd

- name: Enable domain time
  ansible.builtin.systemd:
    name: ntpd.service
    enabled: true
    state: started

- name: Verify the provisioned directory identity
  ansible.builtin.command:
    argv:
      - /usr/bin/samba-tool
      - domain
      - info
      - "127.0.0.1"
  register: homelab_ad_domain_info
  changed_when: false

- name: Validate the generated Samba configuration
  ansible.builtin.command:
    argv:
      - /usr/bin/testparm
      - --suppress-prompt
  changed_when: false

- name: Check the directory database
  ansible.builtin.command:
    argv:
      - /usr/bin/samba-tool
      - dbcheck
      - --cross-ncs
  changed_when: false
  register: homelab_ad_dbcheck
  failed_when: >-
    homelab_ad_dbcheck.rc != 0 or
    'ERROR' in homelab_ad_dbcheck.stdout

- name: Verify LDAP service discovery
  ansible.builtin.command:
    argv:
      - /usr/bin/host
      - -t
      - SRV
      - "_ldap._tcp.{{ homelab_ad_dns_domain }}"
      - "127.0.0.1"
  changed_when: false

- name: Verify LDAP service discovery from the client-facing address
  # The loopback query above proves the SRV records exist in the zone. It does
  # not prove Samba's internal DNS answers them on the address a client asks,
  # and that was the only unverified link in the 2026-08-14 gate-8 failure: an
  # Arch workstation joined this directory, read the operator out of it over
  # LDAP, and SSSD still reported "AD Domain Controller: not connected" --
  # because SSSD's AD provider locates a controller by SRV lookup alone, while
  # Samba's `net ads` can fall back to a NetBIOS broadcast. Nothing anywhere
  # asked the question this task asks.
  #
  # Asking it by name rather than by address keeps the role free of an address
  # literal (ADR 0046, and scripts/site check enforces it): this host's own
  # fully qualified name resolves to its client-facing address -- the "Resolve
  # the permanent Controller name before mutation" task above has already
  # required that -- so `host` sends the query there and not to loopback.
  # Fail-closed by construction: host exits non-zero on NXDOMAIN, SERVFAIL,
  # REFUSED and timeout alike, so a directory whose DNS clients cannot use it
  # fails convergence here instead of twenty minutes later in a guest serial
  # log.
  ansible.builtin.command:
    argv:
      - /usr/bin/host
      - -t
      - SRV
      - "_ldap._tcp.{{ homelab_ad_dns_domain }}"
      - "{{ homelab_ad_expected_hostname }}.{{ homelab_ad_dns_domain }}"
  changed_when: false

- name: Refuse an existing directory with a different realm
  ansible.builtin.assert:
    that:
      - >-
        homelab_ad_domain_info.stdout is search(
          '(?m)^Forest\\s*:\\s*' ~ homelab_ad_dns_domain ~ '$')
      - >-
        homelab_ad_domain_info.stdout is search(
          '(?m)^Domain\\s*:\\s*' ~ homelab_ad_dns_domain ~ '$')
      - >-
        homelab_ad_domain_info.stdout is search(
          '(?m)^Netbios domain\\s*:\\s*' ~ homelab_ad_netbios_domain ~ '$')
    fail_msg: >-
      The existing Samba database does not describe
      {{ homelab_ad_netbios_domain }} / {{ homelab_ad_realm }}. Ansible will
      not rename or replace a directory.

# ---------------------------------------------------------------------------
# Durable directory accounts (ADR 0055)
#
# Everything below is inert unless the instance declares a roster, and runs
# last on purpose: the realm assertion above has already refused a directory
# that is not the declared one, samba.service is up, its handlers are flushed,
# and nsswitch.conf already consults the directory -- so `getent` here asks the
# same name service smbd asks when it clones [homes].
#
# The disposable acceptance Controller declares nothing, so its synthetic
# per-run roster (staged over the serial by homelab/vm/controller_principals.py,
# 21/21 checks as of 2026-08-14) is untouched by every task in this section.
#
# ONE DECLARATION. homelab_ad_directory_accounts names contract ROLES, never
# accounts: the real names live once, in the owner's gitignored
# homelab/instance/identity/principals.json (ADR 0046), which is also what names
# the accounts baked onto an installed workstation disk. The first task in the
# block below renders this role's whole account plan -- names, roles and the
# rfc2307 POSIX identifiers -- from that one declaration, on the Ansible CONTROL
# HOST, because the driver runs in a guest that carries only homelab/ansible and
# must not be handed the owner's private overlay. Nothing in this role derives a
# uidNumber; the rule lives only in
# homelab/vm/controller_principals.directory_account_plan and is keyed on the
# ROLE, so renaming an account moves no UID and appending a role renumbers none.
#
# Why this is not just "samba-tool user create":
#   * `samba-tool user create <name> <password>` takes the password
#     POSITIONALLY, which puts it in the process table for every local user to
#     read, and in Ansible's own task log. Omitting it makes samba-tool prompt
#     on a terminal that does not exist under Ansible. So account creation goes
#     through the same shape first provisioning already uses: a root-owned 0700
#     driver, installed and removed around one invocation, which opens the
#     protected file itself and hands the value to Samba's in-process API. The
#     role passes PATHS, never values.
#   * The directory must survive relaunching, so nothing here re-creates an
#     account that exists or rewrites a password that is already set. The
#     first-provisioning skip above (`when: not homelab_ad_database.stat.exists`)
#     keeps the domain SID and krbtgt across a bring-up; these tasks keep the
#     accounts, their SIDs and their credentials across the same bring-up.
- name: Converge the declared durable directory accounts
  when: homelab_ad_directory_accounts | length > 0
  block:
    - name: Validate the declared durable account roster
      # This list declares contract ROLES, so the only things to check here are
      # its shape and the two values this role uses for itself. Whether a role
      # exists, whether it is a directory role at all, and what uidNumber it
      # owns are decided by the one allocation rule, in the resolver below.
      ansible.builtin.assert:
        that:
          - homelab_ad_directory_accounts | length > 0
          - homelab_ad_directory_accounts
            | select('match', '^[a-z][a-z0-9_]{0,62}$') | list | length ==
            homelab_ad_directory_accounts | length
          - homelab_ad_directory_accounts | unique | list | length ==
            homelab_ad_directory_accounts | length
          - homelab_ad_posix_admin_group in homelab_ad_posix_group_rids
          - homelab_ad_account_share_root | length > 0
          - homelab_ad_account_password_file_template is search('{name}')
          - homelab_ad_account_password_file_template is match('/')
          - homelab_ad_account_password_reset_roles
            | difference(homelab_ad_directory_accounts) | length == 0
        fail_msg: >-
          homelab_ad_directory_accounts is not a usable declaration. It names
          the contract roles this instance keeps as durable directory accounts
          -- `standard_user`, `daily_administrator`, `domain_administrator` --
          each at most once, and never an account name: real names are declared
          once, in homelab/instance/identity/principals.json.
          homelab_ad_account_password_file_template must be an absolute path
          containing `{name}`, and every role named for a password reset must
          also be declared here.

    - name: Resolve the durable account roster on the Ansible control host
      # THE BRIDGE. The account plan is derived where the one roster loader and
      # the one POSIX allocation rule live -- the repository -- and the guest
      # receives only the finished plan as ordinary Ansible data. It cannot be
      # derived in the guest: the Controller carries only homelab/ansible, and
      # staging the owner's private identity overlay into a guest would spread
      # instance data (ADR 0046) for no reason.
      #
      # Fail-closed by construction: the resolver exits non-zero, with a named
      # reason on stderr, for an unknown role, for `local_rescue`, for a roster
      # overlay it cannot understand, and for a well-known-group declaration
      # that disagrees with the allocation. Nothing has been mutated yet.
      #
      # become: false because this reads a file in the operator's own checkout;
      # run_once because the plan is a property of the instance, not of a host;
      # check_mode: false because it mutates nothing and the tasks after it need
      # its output to say anything useful in a --check run.
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ role_path }}/files/resolve-directory-accounts.py"
          - --roles
          - "{{ homelab_ad_directory_accounts | join(',') }}"
          - --admin-group
          - "{{ homelab_ad_posix_admin_group }}"
          - --group-rids-json
          - "{{ homelab_ad_posix_group_rids | to_json }}"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false
      check_mode: false
      register: homelab_ad_resolved_roster

    - name: Adopt the resolved durable account plan
      ansible.builtin.set_fact:
        homelab_ad_directory_plan: >-
          {{ homelab_ad_resolved_roster.stdout | from_json }}

    - name: Require the resolved plan to cover exactly the declared roles
      # The resolver is the authority on names and identifiers; this is the one
      # thing the role must confirm for itself, because a plan that silently
      # covered fewer roles than were declared would converge fewer accounts
      # than the owner asked for and report success.
      ansible.builtin.assert:
        that:
          - homelab_ad_directory_plan.schema == 1
          - homelab_ad_directory_plan.accounts | length ==
            homelab_ad_directory_accounts | length
          - homelab_ad_directory_plan.accounts
            | map(attribute='contract_role') | sort ==
            homelab_ad_directory_accounts | sort
          - homelab_ad_directory_plan.admin_group ==
            homelab_ad_posix_admin_group
          - homelab_ad_directory_plan.groups | length ==
            homelab_ad_posix_group_rids | length
          - homelab_ad_directory_plan.groups | list | sort ==
            homelab_ad_posix_group_rids | list | sort
        fail_msg: >-
          The resolved durable account plan does not cover exactly the declared
          contract roles, or does not allocate exactly the well-known groups
          this role verifies. Nothing has been changed on the Controller.

    - name: List the directory accounts that already exist
      # What makes the whole section idempotent, and what decides which
      # accounts need a credential at all: an account already in the directory
      # keeps its password, so the operator can delete its file after the
      # account is created and re-converge for years without staging a secret
      # again.
      ansible.builtin.command:
        argv:
          - /usr/bin/samba-tool
          - user
          - list
      register: homelab_ad_existing_users
      changed_when: false

    - name: Start the durable POSIX allocation from an empty plan
      # The group allocation is adopted whole from the resolved plan: gidNumber
      # is base + the group's well-known RID, and that arithmetic lives only in
      # controller_principals.py. Both groups must carry a gidNumber before any
      # SSSD client running with ldap_id_mapping = False can resolve them, and a
      # user's primary gid comes from Domain Users.
      ansible.builtin.set_fact:
        homelab_ad_account_plan: []
        homelab_ad_account_group_plan: "{{ homelab_ad_directory_plan.groups }}"

    - name: Complete the resolved plan with this run's convergence decisions
      # The resolved entry already carries the account's name, its directory
      # role and all four rfc2307 attributes an SSSD client with
      # ldap_id_mapping = False must read out of the directory. This adds only
      # what is a property of THIS run and of THIS target: where the credential
      # was staged, whether a rotation was authorized for that role, and whether
      # the directory already holds the account. No identifier is computed here.
      ansible.builtin.set_fact:
        homelab_ad_account_plan: >-
          {{ homelab_ad_account_plan + [item | combine({
               'password_file': homelab_ad_account_password_file_template
                                | replace('{name}', item.name),
               'reset_password': item.contract_role
                                 in homelab_ad_account_password_reset_roles,
               'create': item.name | lower not in (
                 homelab_ad_existing_users.stdout_lines | map('trim')
                 | map('lower') | list),
             })] }}
      loop: "{{ homelab_ad_directory_plan.accounts }}"
      loop_control:
        label: "{{ item.contract_role }}"

    - name: Require a password-file path for every declared durable account
      # A path, not a value: the file itself is staged out of band, root-owned
      # and 0600, and is only required to EXIST for an account that does not
      # exist yet. Asserted in aggregate so no individual path reaches the log.
      ansible.builtin.assert:
        that:
          - homelab_ad_account_plan
            | map(attribute='password_file', default='')
            | map('trim') | select('equalto', '') | list | length == 0
          - homelab_ad_account_plan
            | map(attribute='password_file', default='')
            | reject('match', '/') | list | length == 0
          - homelab_ad_account_plan
            | map(attribute='password_file', default='') | unique | list
            | length == homelab_ad_account_plan | length
        fail_msg: >-
          Every durable account needs its own absolute password_file path
          (prefer a /run path), and no two accounts may share one. Check
          homelab_ad_account_password_file_template. Do not put the password
          itself in inventory, Git, an Ansible variable, or a command line.

    - name: Read the POSIX identity the directory has already allocated
      # Asked before anything is written, and only for accounts that exist. A
      # durable account's uidNumber is the one thing about it that cannot be
      # re-derived: files on every workstation, its per-user share directory and
      # every ACL keyed on its POSIX identity all reference that number.
      ansible.builtin.command:
        argv:
          - /usr/bin/samba-tool
          - user
          - show
          - "{{ item.name }}"
          - --attributes=sAMAccountName,uidNumber
      register: homelab_ad_account_allocated
      changed_when: false
      loop: "{{ homelab_ad_account_plan | rejectattr('create') | list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Refuse to renumber a durable account the directory already holds
      # The rule is role-positional, so this can only fire for a directory whose
      # accounts were allocated under some other keying -- for instance the
      # declaration-order keying this role applied before the roster became one
      # declaration. An account carrying no uidNumber at all is not a renumber:
      # the driver stages it below.
      ansible.builtin.assert:
        that:
          - >-
            homelab_ad_account_renumber_enabled | bool or
            item.stdout is not search('(?m)^uidNumber:') or
            item.stdout is search('(?m)^uidNumber:\s*'
                                  ~ item.item.uidNumber ~ '\s*$')
        fail_msg: >-
          {{ item.item.name }} already holds a uidNumber in the directory that
          is not the {{ item.item.uidNumber }} this role's one allocation rule
          gives its role. Moving it would orphan every file that account owns.
          Migrate deliberately -- re-own its files and its per-user share
          directory -- and set homelab_ad_account_renumber_enabled for that one
          run.
      loop: "{{ homelab_ad_account_allocated.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Inspect the password file of every durable account to be created
      # no_log because stat returns a checksum of the file it inspected, which
      # for a one-line password file is a hash of the password itself.
      ansible.builtin.stat:
        path: "{{ item.password_file }}"
        get_checksum: false
      loop: "{{ homelab_ad_account_plan | selectattr('create') | list }}"
      register: homelab_ad_account_password
      no_log: true

    - name: Require a protected password file for every new durable account
      # The same refusal first provisioning makes for the domain administrator,
      # per account. The driver re-checks all of it as root at the moment it
      # opens the file; this is the check that stops convergence before
      # anything is installed on the target.
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.uid == 0
          - item.stat.mode == '0600'
          - item.stat.size > 0
        fail_msg: >-
          Creating a durable directory account requires a root-owned 0600
          password file already on the target, one per account. Remove each
          file once its account exists; a later run needs a file only for an
          account the directory does not have yet.
      loop: "{{ homelab_ad_account_password.results }}"
      no_log: true

    - name: Converge the durable accounts with an ephemeral credential feeder
      block:
        - name: Create the local helper directory for the account driver
          ansible.builtin.file:
            path: /usr/local/libexec
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Install the durable account driver
          ansible.builtin.copy:
            src: provision-accounts.py
            dest: /usr/local/libexec/homelab-provision-accounts
            owner: root
            group: root
            mode: "0700"

        - name: Create and converge the durable directory accounts
          # The plan carries names, POSIX identifiers and password-file PATHS.
          # The driver opens each file itself and hands what it reads to
          # Samba's in-process API, so no credential enters argv, the process
          # table, the environment, an Ansible variable, or this task's log.
          ansible.builtin.command:
            argv:
              - /usr/local/libexec/homelab-provision-accounts
              - --plan-json
              - "{{ homelab_ad_account_plan | to_json }}"
              - --groups-json
              - "{{ homelab_ad_account_group_plan | to_json }}"
              - --primary-group
              - "{{ homelab_ad_directory_plan.primary_group }}"
              - --admin-group
              - "{{ homelab_ad_directory_plan.admin_group }}"
              - --posix-base
              - "{{ homelab_ad_directory_plan.posix_base }}"
              - --diagnostic-file
              - /run/homelab-provision-accounts.status
              - "{{ '--allow-password-reset'
                    if homelab_ad_account_password_reset_enabled | bool
                    else '--refuse-password-reset' }}"
          register: homelab_ad_account_convergence
          # The driver reports its own change decision, so a converged
          # directory reports ok rather than changed on every run. `and`
          # short-circuits, so a failed run never reaches from_json.
          changed_when: >-
            homelab_ad_account_convergence.rc == 0 and
            ((homelab_ad_account_convergence.stdout | from_json).changed
             | bool)
          no_log: true
      always:
        - name: Remove the durable account driver
          ansible.builtin.file:
            path: /usr/local/libexec/homelab-provision-accounts
            state: absent

    - name: Create each durable account's per-user storage directory
      # The gate-9 [homes] share serves /srv/unas/%S, and smbd maps the
      # connecting account through the directory's rfc2307 attributes, so the
      # directory must be owned by the account's uidNumber for the owner to
      # reach their own files. Numeric owner and group deliberately: this is
      # the same chown controller_principals.py performs for the acceptance
      # roster, and it must not depend on the name service being warm.
      ansible.builtin.file:
        path: "{{ homelab_ad_account_share_root }}/{{ item.name }}"
        state: directory
        owner: "{{ item.uidNumber }}"
        group: "{{ item.gidNumber }}"
        mode: "0700"
      loop: "{{ homelab_ad_account_plan }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Verify each durable account's POSIX attributes in the directory
      # This is what an SSSD client with ldap_id_mapping = False reads over
      # LDAP. Without all four attributes the account cannot log in at all, and
      # a half-provisioned account must stop convergence here rather than
      # surface as an unusable workstation. Fail-closed: samba-tool exits
      # non-zero on a missing account, and each expected value must appear.
      ansible.builtin.command:
        argv:
          - /usr/bin/samba-tool
          - user
          - show
          - "{{ item.name }}"
          - --attributes=sAMAccountName,uidNumber,gidNumber,loginShell,unixHomeDirectory
      register: homelab_ad_account_posix
      changed_when: false
      failed_when: >-
        homelab_ad_account_posix.rc != 0 or
        ('uidNumber: ' ~ item.uidNumber) not in homelab_ad_account_posix.stdout or
        ('gidNumber: ' ~ item.gidNumber) not in homelab_ad_account_posix.stdout or
        ('loginShell: ' ~ item.loginShell) not in homelab_ad_account_posix.stdout or
        ('unixHomeDirectory: ' ~ item.unixHomeDirectory)
        not in homelab_ad_account_posix.stdout
      loop: "{{ homelab_ad_account_plan }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Verify the well-known groups carry the POSIX gid clients resolve
      # A user's primary gid comes from Domain Users, and the Arch identity
      # probe resolves Domain Admins by name (workstations/arch_second.py), so
      # both groups need a gidNumber before any client with
      # ldap_id_mapping = False can resolve either.
      ansible.builtin.command:
        argv:
          - /usr/bin/samba-tool
          - group
          - show
          - "{{ item.key }}"
          - --attributes=sAMAccountName,gidNumber
      register: homelab_ad_group_posix
      changed_when: false
      failed_when: >-
        homelab_ad_group_posix.rc != 0 or
        ('gidNumber: ' ~ item.value) not in homelab_ad_group_posix.stdout
      loop: "{{ homelab_ad_account_group_plan | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Verify every durable administrator is a Domain Admins member
      # ADR 0055/0063: the DOMAIN administrator is a Domain Admins member with
      # passworded sudo on the workstation, never root and never the local
      # break-glass account. The sudo half lives in the workstation lane; this
      # is the directory half, and it is asserted rather than assumed because a
      # created-but-unprivileged administrator looks like a working account
      # until the day it is needed.
      #
      # Checked in BOTH directions, which is the half that was missing. The
      # `daily_administrator` role maps to `standard` here precisely because it
      # must NOT be a Domain Admins member -- that separation is what gate 8's
      # `domain-admin-separate` check proves from this very group's member list,
      # and an extra member would defeat it silently. The provisioning driver
      # makes the same two-way assertion at the moment of use.
      ansible.builtin.command:
        argv:
          - /usr/bin/samba-tool
          - group
          - listmembers
          - "{{ homelab_ad_posix_admin_group }}"
      register: homelab_ad_admin_members
      changed_when: false
      failed_when: >-
        homelab_ad_admin_members.rc != 0 or
        (homelab_ad_account_plan | selectattr('role', 'equalto', 'administrator')
         | map(attribute='name')
         | reject('in', homelab_ad_admin_members.stdout_lines | map('trim')
                        | map('lower') | list)
         | list | length > 0) or
        (homelab_ad_account_plan | rejectattr('role', 'equalto', 'administrator')
         | map(attribute='name')
         | select('in', homelab_ad_admin_members.stdout_lines | map('trim')
                        | map('lower') | list)
         | list | length > 0)

    - name: Verify the Controller resolves every durable account by name
      # The check the 2026-08-14 gate-8 failure had nowhere to fail, applied to
      # the accounts that must actually log in: smbd can only clone [homes] for
      # a name THIS host resolves to a passwd entry, and an account nobody can
      # resolve is an account nobody can log in as. Bounded retries because the
      # samba restart earlier in this role takes the internal winbindd with it.
      ansible.builtin.command:
        argv:
          - /usr/bin/getent
          - passwd
          - "{{ item.name }}"
      register: homelab_ad_account_nss
      changed_when: false
      until: homelab_ad_account_nss.rc == 0
      retries: 12
      delay: 5
      loop: "{{ homelab_ad_account_plan }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Require the resolved identity to be the directory's own POSIX one
      # uid and gid are read from the START of the passwd line and the home
      # directory from the END, on purpose: a display name may legally contain
      # a colon, which shifts every field after GECOS but none before it.
      #
      # The uid is asserted exactly, because /srv/unas/<name> is owned by that
      # number and a mismatch means the share owner cannot read their own
      # files. The gid is only required to be present and numeric here: with
      # `idmap_ldb:use rfc2307 = yes` winbindd should return the Domain Users
      # gidNumber, but if anything resolved that group before it carried one,
      # idmap.ldb may hold an allocated mapping instead. The authoritative
      # gidNumber check is the directory one above; this one asks whether the
      # account resolves at all.
      #
      # The shell field is deliberately NOT compared with loginShell: this role
      # does not set `winbind nss info = rfc2307` (see the reason above the
      # `winbind use default domain` task), so winbindd answers from
      # `template shell` here while SSSD on the workstation reads loginShell
      # out of the directory. Comparing them would fail on a correct system.
      ansible.builtin.assert:
        that:
          - item.stdout_lines | length >= 1
          - item.stdout_lines[0].split(':') | length >= 7
          - item.stdout_lines[0].split(':')[2] | int == item.item.uidNumber
          - item.stdout_lines[0].split(':')[3] | int > 0
          - item.stdout_lines[0].split(':')[-2] | length > 0
        fail_msg: >-
          A durable account resolves on this Controller with an identity that
          is not the one stored in the directory, or without a home-directory
          field. smbd cannot clone [homes] without that field, and a uid that
          is not the account's uidNumber means idmap.ldb holds a stale
          allocated mapping: check `idmap_ldb:use rfc2307`, then flush the
          winbind cache and re-run.
      loop: "{{ homelab_ad_account_nss.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Verify each per-user storage directory belongs to its account
      ansible.builtin.stat:
        path: "{{ homelab_ad_account_share_root }}/{{ item.name }}"
      register: homelab_ad_account_share
      changed_when: false
      loop: "{{ homelab_ad_account_plan }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Require each per-user storage directory to be owned and private
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
          - item.stat.uid == item.item.uidNumber
          - item.stat.gid == item.item.gidNumber
          - item.stat.mode == '0700'
        fail_msg: >-
          A durable account's {{ homelab_ad_account_share_root }} directory is
          missing, or is not owned exclusively by that account's directory
          POSIX identity, so its per-user share would serve files its owner
          cannot read or another account can.
      loop: "{{ homelab_ad_account_share.results }}"
      loop_control:
        label: "{{ item.item.name }}"
