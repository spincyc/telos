---
- name: Refuse a break-glass administrator name this role cannot use safely
  # This value is interpolated raw into three places that cannot defend
  # themselves: a `useradd` name, the FILENAME /etc/sudoers.d/10-<name>, and the
  # sudoers RULE inside it. A name containing a slash or `..` writes the rule
  # somewhere else entirely; one containing whitespace writes a rule about a
  # different principal. `visudo -csf` catches only the third of those, and only
  # when the result is syntactically invalid.
  #
  # The pattern is useradd's own NAME_REGEX, bounded at 32 characters. It also
  # refuses the `<break-glass-user>` placeholder the instance template ships,
  # which is the intended failure: converging with the template unfilled would
  # otherwise create an account literally called `<break-glass-user>`.
  ansible.builtin.assert:
    that:
      - homelab_breakglass_user is string
      - homelab_breakglass_user is match('^[a-z_][a-z0-9_-]{0,31}$')
      - homelab_breakglass_user != 'root'
    fail_msg: >-
      homelab_breakglass_user must be a plain lower-case account name of at
      most 32 characters (useradd's own NAME_REGEX) and must not be `root`
      (ADR 0055: the break-glass administrator is a separately named local
      account with its own sudo rule). It is
      {{ homelab_breakglass_user | default('undefined') | quote }}.

- name: Set the timezone
  community.general.timezone:
    name: "{{ homelab_timezone }}"

- name: Create the break-glass administrator
  ansible.builtin.user:
    name: "{{ homelab_breakglass_user }}"
    shell: /bin/bash
    create_home: true
    password_lock: true          # key-only; no password to guess or expire
  # ADR 0055: mandatory on every managed machine, and never a directory account.

- name: Install the break-glass authorized keys
  ansible.posix.authorized_key:
    user: "{{ homelab_breakglass_user }}"
    key: "{{ item }}"
    exclusive: false
  loop: "{{ homelab_breakglass_authorized_keys }}"
  when: homelab_breakglass_authorized_keys | length > 0

- name: Refuse to converge without a break-glass key
  ansible.builtin.assert:
    that: homelab_breakglass_authorized_keys | length > 0
    fail_msg: >-
      No break-glass key is configured for {{ inventory_hostname }}. Converging
      identity onto a machine with no local way back in is how a directory
      outage becomes an unrecoverable machine (ADR 0055).

- name: Grant the break-glass administrator sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/10-{{ homelab_breakglass_user }}"
    content: "{{ homelab_breakglass_user }} ALL=(ALL:ALL) ALL\n"
    mode: "0440"
    validate: /usr/sbin/visudo -csf %s

- name: Harden sshd
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-homelab.conf
    mode: "0644"
    content: |
      # GENERATED by Ansible (ADR 0053). Do not edit on the host.
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
  notify: reload sshd

- name: Enable sshd
  ansible.builtin.systemd:
    name: sshd
    enabled: true
    state: started
