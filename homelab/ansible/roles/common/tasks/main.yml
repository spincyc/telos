---
- name: Set the timezone
  community.general.timezone:
    name: "{{ homelab_timezone }}"

- name: Create the break-glass administrator
  ansible.builtin.user:
    name: "{{ homelab_breakglass_user }}"
    shell: /bin/bash
    create_home: true
    password_lock: true          # key-only; no password to guess or expire
  # ADR 0055: mandatory on every managed machine, and never a directory account.

- name: Install the break-glass authorized keys
  ansible.posix.authorized_key:
    user: "{{ homelab_breakglass_user }}"
    key: "{{ item }}"
    exclusive: false
  loop: "{{ homelab_breakglass_authorized_keys }}"
  when: homelab_breakglass_authorized_keys | length > 0

- name: Refuse to converge without a break-glass key
  ansible.builtin.assert:
    that: homelab_breakglass_authorized_keys | length > 0
    fail_msg: >-
      No break-glass key is configured for {{ inventory_hostname }}. Converging
      identity onto a machine with no local way back in is how a directory
      outage becomes an unrecoverable machine (ADR 0055).

- name: Grant the break-glass administrator sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/10-{{ homelab_breakglass_user }}"
    content: "{{ homelab_breakglass_user }} ALL=(ALL:ALL) ALL\n"
    mode: "0440"
    validate: /usr/sbin/visudo -csf %s

- name: Harden sshd
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-homelab.conf
    mode: "0644"
    content: |
      # GENERATED by Ansible (ADR 0053). Do not edit on the host.
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
  notify: reload sshd

- name: Enable sshd
  ansible.builtin.systemd:
    name: sshd
    enabled: true
    state: started
