---
# The configuration is generated by the same code the installer and the
# bootstrap host use (homelab/lib/dnsmasq.py, homelab/lib/artifacts.py) rather
# than by an Ansible template. One generator means the file cannot drift from
# the decisions it encodes, and the generator is unit-tested.

- name: Stop if this Controller does not own DHCP and DNS
  ansible.builtin.meta: end_host
  when: homelab_manifest.network is not defined

- name: Generate the service configuration on the control node
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/../../bin/homelab-render"
      - --manifest-json
      - "{{ homelab_manifest | to_json }}"
      - --lease-time
      - "{{ homelab_lease_time }}"
  register: homelab_rendered
  changed_when: false

- name: Install the dnsmasq configuration
  ansible.builtin.copy:
    dest: "{{ homelab_config_dir }}/dnsmasq.conf"
    content: "{{ (homelab_rendered.stdout | from_json).dnsmasq }}"
    mode: "0644"
  notify: restart controller network services

- name: Install the artifact service configuration
  ansible.builtin.copy:
    dest: "{{ homelab_config_dir }}/nginx.conf"
    content: "{{ (homelab_rendered.stdout | from_json).nginx }}"
    mode: "0644"
  notify: restart controller network services

- name: Install the iPXE boot script
  ansible.builtin.copy:
    dest: "{{ homelab_http_root }}/boot.ipxe"
    content: "{{ (homelab_rendered.stdout | from_json).ipxe }}"
    mode: "0644"

- name: Install the unit files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item | basename }}"
    mode: "0644"
  loop:
    - ../../profiles/controller/systemd/dnsmasq-homelab.service
    - ../../profiles/controller/systemd/nginx-homelab.service
    - ../../profiles/controller/systemd/homelab-first-boot.service
  notify: reload systemd

- name: Enable only the activation unit
  ansible.builtin.systemd:
    name: homelab-first-boot.service
    enabled: true
    daemon_reload: true
  # ADR 0009: dnsmasq and nginx are deliberately NOT enabled. They start only
  # after activation has verified this machine is the sole DHCP authority on
  # the segment it is plugged into. Enabling them here would bypass that.
