# Homelab convergence (ADR 0053).
#
# Install time does only what cannot be done later. Everything else is here,
# runnable as a diff, and the same mechanism for the Controller and every
# Workstation. There is no privileged manual path.
[defaults]
inventory = ../instance/inventory/hosts.yml
roles_path = roles
# The `community.general.yaml` callback was removed in that collection's 12.0.0
# and every run aborted outright on a host carrying it: "the plugin has been
# superseded by the option result_format=yaml". This is the documented
# replacement and needs only ansible-core 2.13, so it costs no readability.
stdout_callback = default
# The recognised ini key for this option is `callback_result_format` in
# [defaults] (ansible-core's result_format_callback documentation fragment).
# `result_format` is what the option is called on the callback plugin, not in
# a configuration file: written that way ansible-core silently ignored it and
# every host-side run printed JSON. The in-guest factory configuration
# (homelab/vm/controller_factory.py) already spelled it correctly.
callback_result_format = yaml
callbacks_enabled = profile_tasks
host_key_checking = True
retry_files_enabled = False
interpreter_python = /usr/bin/python3
# Diffs are the review surface. Always show them.
display_skipped_hosts = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
