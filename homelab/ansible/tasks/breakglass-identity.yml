---
# THE BRIDGE for the break-glass administrator's name, and the only thing that
# crosses it.
#
# ADR 0055 and ADR 0063 make that account the ONLY way into a machine while the
# directory is down. Its name was declared twice -- principals.local_rescue.name
# in the owner's gitignored homelab/instance/identity/principals.json, which
# the Python installer path bakes onto a workstation DISK, and
# homelab_breakglass_user in inventory/group_vars/all.yml, which roles/common
# creates on a CONVERGED host -- and nothing checked that they agreed. Two names
# that disagree means the account you can log in as is not the account the disk
# was built to trust, discovered at exactly the moment you needed it.
#
# The roster is now the single declaration and homelab_breakglass_user derives
# from it, through the ONE loader
# (homelab/workstations/arch_second.identity_roster) that resolves it for every
# other reader. Nothing here restates the roster's rules.
#
# It cannot be derived on the target: a target converged from the staged
# factory payload carries only homelab/ansible, and staging the owner's private
# identity overlay into a guest would spread instance data (ADR 0046) for no
# reason. So the derivation runs on the Ansible CONTROL HOST -- where the whole
# repository is -- and the target receives nothing but the finished name as
# ordinary Ansible data. The same shape files/resolve-directory-identity.py and
# roles/domain_controller's durable-account resolver already use.
#
# Included by roles/common, and it sits HERE rather than inside that role for
# the same reason its sibling does: it belongs to the identity scheme rather
# than to one role, `{{ role_path }}/../..` is homelab/ansible from any role,
# and a new role under ansible/roles/ would owe package-contract.json a layer
# it does not need. roles/common is the right host for the include because it
# is the role that actually creates the account, it is carried by every play
# that converges a machine (playbooks/controller.yml and
# playbooks/workstation.yml), and it is carried by NO other play -- notably not
# by playbooks/bootstrap-controller.yml, the one the factory bundle runs inside
# the disposable acceptance Controller.
#
# homelab_identity_roster_overlay overrides which roster is read, and empty --
# the only value a run should ever use -- means
# homelab/instance/identity/principals.json in this checkout. It exists so a
# test can resolve a fixture it wrote itself rather than whatever private
# overlay the developer's machine happens to carry.
- name: Resolve the break-glass administrator on the Ansible control host
  # become: false because this reads a file in the operator's own checkout;
  # run_once because the break-glass name is a property of the instance, not of
  # a host, and one subprocess per PLAY is the whole cost of this bridge even
  # on a play that converges every workstation; check_mode: false because it
  # mutates nothing and every task after it needs its output to say anything
  # useful in a --check run.
  #
  # Fail-closed by construction: the resolver exits non-zero, with a named
  # reason on stderr, for a roster it cannot understand, for a roster whose
  # state is unknown, for a roster that names `root`, and for a
  # homelab_breakglass_user that disagrees with it. Nothing has been mutated
  # yet -- this runs before the role's own first assert.
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - "{{ role_path }}/../../files/resolve-breakglass-identity.py"
      - --declared-json
      - "{{ {
            'homelab_breakglass_user':
              homelab_breakglass_user | default(''),
          } | to_json }}"
      - --overlay
      - "{{ homelab_identity_roster_overlay | default('') }}"
      - --declared-source
      - >-
        the Ansible inventory
        ({{ inventory_file | default('inventory/group_vars', true) }}
        and its group_vars)
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  check_mode: false
  register: homelab_breakglass_identity_resolved

- name: Adopt the resolved break-glass administrator
  ansible.builtin.set_fact:
    homelab_breakglass_identity: >-
      {{ homelab_breakglass_identity_resolved.stdout | from_json }}

- name: Require the resolution to be the shape this role understands
  ansible.builtin.assert:
    that:
      - homelab_breakglass_identity.schema == 1
      - homelab_breakglass_identity.contract_role == 'local_rescue'
      - homelab_breakglass_identity.roster | length == 0 or
        homelab_breakglass_identity.breakglass_user | length > 0
    fail_msg: >-
      The resolved break-glass administrator is not the document this role
      knows how to consume. Nothing has been changed on any host.

- name: Say that the break-glass name is still declared twice and unchecked
  # Not a failure: with no roster this is exactly the behaviour that existed
  # before this bridge, and refusing here would rename the account on every
  # host that has no overlay. But it is the state in which the defect this
  # bridge closes is still open, and the run is the moment worth saying so.
  ansible.builtin.debug:
    msg: >-
      No private identity roster at homelab/instance/identity/principals.json,
      so homelab_breakglass_user
      ({{ homelab_breakglass_user | default('the role default') }}) is a second
      declaration of a name nothing compares with the one baked onto the
      installed workstation disks. Seed the roster (`make homelab-instance`)
      and name local_rescue in it to have the two proved equal.
  run_once: true
  when: homelab_breakglass_identity.roster | length == 0

- name: Derive the break-glass administrator from the one roster declaration
  # With a roster, it is authoritative and homelab_breakglass_user is set from
  # it -- a set_fact outranks inventory group_vars, so nothing left in the
  # inventory can take effect behind this. An inventory value that DISAGREED
  # was already refused by name above, so this can only ever restate or fill
  # in. The role's own first assert then judges the DERIVED name, which is what
  # keeps the useradd/sudoers safety gate and the `!= root` rule in force over
  # whatever the roster says.
  #
  # With NO roster nothing happens here at all: homelab_breakglass_user keeps
  # whatever the inventory declared, and the role default, and the assert,
  # exactly as before this file existed. That is what leaves the disposable
  # acceptance path untouched twice over -- it has no overlay, and the play it
  # runs carries no `common` role in the first place.
  ansible.builtin.set_fact:
    homelab_breakglass_user:
      "{{ homelab_breakglass_identity.breakglass_user }}"
  when: homelab_breakglass_identity.roster | length > 0
