# Controller-only variables.
---
# ADR 0054: off by default. Set true on the host that should run the always-on
# applications -- today that may be the Controller itself; moving them later
# changes which host claims the role and nothing else.
homelab_services_enabled: false

homelab_services: []
# - name: homebridge
#   description: HomeKit bridge
#   image: ghcr.io/homebridge/homebridge@sha256:<digest>
#   # Host networking is required: mDNS does not traverse a container network,
#   # and HomeKit pairing does not work without it.
#   host_network: true
#   state_path: /homebridge
# - name: openhab
#   image: docker.io/openhab/openhab@sha256:<digest>
#   host_network: true
#   devices:
#     # Stable by-id path. A /dev/ttyUSB number is reassigned on reboot and
#     # would hand this application somebody else's radio.
#     - /dev/serial/by-id/<usb-radio-id>

# ADR 0055: the durable directory accounts a PERSISTENT Controller keeps across
# bring-ups. This names contract ROLES, never accounts: the real account names
# are declared exactly once, in identity/principals.json beside this file, which
# is the same declaration that names the accounts baked onto an installed
# workstation disk. Order is immaterial -- the uidNumber belongs to the role, so
# renaming an account moves no UID and adding a role appends one.
#
# Leave it empty on the disposable acceptance Controller: its roster is
# synthetic, per-run, and staged over the serial console instead.
#
# `local_rescue` is refused outright. It is a LOCAL account at UID 1000 on the
# workstation (ADR 0055, ADR 0063) and must never become a directory principal.
homelab_ad_directory_accounts: []
# - standard_user           # unprivileged directory account
# - daily_administrator     # passworded sudo on the workstation, NOT a Domain
#                           # Admins member -- gate 8 proves that separation
# - domain_administrator    # the Domain Admins member

# Where each new account's initial credential is staged on the Controller, as a
# path template. `{name}` becomes the account's own resolved name. The file is a
# root-owned 0600 regular file with one non-empty first line, and is only needed
# for an account the directory does not have yet -- delete it afterwards. Never
# put the credential itself in this overlay, in Git, or on a command line.
homelab_ad_account_password_file_template: /run/secrets/homelab-ad-{name}

# ADR 0055: enable only once the domain controller exists and answers. Joining
# a machine to a directory that is not ready is how a working machine stops
# being able to log in.
homelab_identity_enabled: false
homelab_identity_domain: <domain>.home.arpa
homelab_identity_realm: <DOMAIN>.HOME.ARPA
homelab_identity_netbios_domain: <DOMAIN>
# Name a controller to take SSSD's login path off SRV discovery. Give the NAME,
# never an address: SSSD warns that an ad_server which is an address breaks
# GSSAPI. Leave it empty on a multi-controller site, where discovery is what you
# want. A live gate-8 run lost a day to this: an Arch workstation joined the
# directory and read its own users out over LDAP while SSSD still could not
# reach a controller, because Samba's own lookups fall back to a broadcast and
# ask a different SRV record than SSSD does.
homelab_identity_domain_controller: <controller>.<domain>.home.arpa
