# Ansible inventory. Copy to homelab/instance/inventory/hosts.yml and replace
# every placeholder with the real value.
#
# A host is named by its fully qualified name in home.arpa (ADR 0002) so that
# a Workstation pivots on a name rather than an address.
#
# `group_vars/` sits BESIDE this file on purpose. Ansible looks for group and
# host variables in the directory the inventory source lives in, so an
# `instance/group_vars/` one level up is silently never loaded: every variable
# in it would fall back to its role default, which for the Controller means a
# domain with no durable accounts in it and no explanation.
---
all:
  children:
    controllers:
      hosts:
        <controller-name>.home.arpa:
          # Must match the hostname recorded in /etc/homelab/manifest.json.
          # The playbook reads the manifest and refuses if the profile is wrong;
          # this is only how Ansible reaches the machine.
          ansible_user: <break-glass-user>

    # The group playbooks/bootstrap-controller.yml targets -- the play that
    # carries the domain_controller role, and therefore the only wired way to
    # converge the directory and its durable accounts from this host.
    #
    # Declared as a parent of `controllers` rather than as a second list of
    # hosts so the Controller cannot end up in one group and not the other: a
    # host that is in `bootstrap_controllers` alone would be reachable by that
    # play while group_vars/controllers.yml -- which holds every AD variable --
    # did not apply to it, and the run would die on the role's first assert.
    bootstrap_controllers:
      children:
        controllers:

    workstations:
      hosts:
        <workstation-name>.home.arpa:
          ansible_user: <break-glass-user>
