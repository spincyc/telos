# Controller-only variables.
---
# ADR 0054: off by default. Set true on the host that should run the always-on
# applications -- today that may be the Controller itself; moving them later
# changes which host claims the role and nothing else.
homelab_services_enabled: false

homelab_services: []
# - name: homebridge
#   description: HomeKit bridge
#   image: ghcr.io/homebridge/homebridge@sha256:<digest>
#   # Host networking is required: mDNS does not traverse a container network,
#   # and HomeKit pairing does not work without it.
#   host_network: true
#   state_path: /homebridge
# - name: openhab
#   image: docker.io/openhab/openhab@sha256:<digest>
#   host_network: true
#   devices:
#     # Stable by-id path. A /dev/ttyUSB number is reassigned on reboot and
#     # would hand this application somebody else's radio.
#     - /dev/serial/by-id/<usb-radio-id>

# ---------------------------------------------------------------------------
# The permanent directory identity (roles/domain_controller).
#
# Every one of these is asserted by the role's FIRST task, before it touches
# anything, and the role ships them empty on purpose: a default here would be
# somebody else's realm. Changing any of them after provisioning is a directory
# migration and not an Ansible convergence, so decide them once.
#
#   * the DNS domain is lower case and under home.arpa (ADR 0002)
#   * the realm is its upper-case equivalent, exactly
#   * the NetBIOS domain is upper case and at most 15 characters
#   * the expected hostname is the Controller's SHORT name, and must equal both
#     the machine's hostname and the label in its inventory name above
#
# These are the HOST-SIDE path, which reaches a Controller over SSH. The same
# three values are declared again, as JSON, in identity/directory.json beside
# this file, for the SIMULATED persistent Controller that has no route to the
# host and is driven over its serial console. Nothing checks that the two
# agree -- this side reads YAML and that side reads JSON -- so set them to the
# same values by hand, once. Both are ADR 0065's permanent identity.
homelab_ad_dns_domain: <domain>.home.arpa
homelab_ad_realm: <DOMAIN>.HOME.ARPA
homelab_ad_netbios_domain: <DOMAIN>
homelab_ad_expected_hostname: <controller-name>

# FIRST PROVISIONING ONLY, and only ever for one deliberate run.
#
# Set this true, stage the file below, run the play, then set it false again.
# With no directory present and this false the role refuses; with a directory
# present the whole provisioning step is skipped and neither of these is read.
homelab_ad_provision_enabled: false

# The PATH of a root-owned 0600 file that already exists ON THE CONTROLLER and
# whose first line is the initial domain Administrator password. Never the
# password itself: this file is in a working tree, and the value would enter
# Git, the Ansible log and every transcript of the run. Stage it over SSH
# immediately before the run and delete it immediately afterwards:
#
#   ssh <controller> 'sudo install -d -m 0700 /run/secrets'
#   ssh <controller> 'sudo install -m 0600 /dev/null /run/secrets/samba-ad-admin'
#   ssh <controller> 'sudo tee /run/secrets/samba-ad-admin >/dev/null'   # type it
#   ...
#   ssh <controller> 'sudo shred -u /run/secrets/samba-ad-admin'
#
# /run is tmpfs, so a reboot removes it whether or not you do.
homelab_ad_admin_password_file: ""

# Optional: publish the per-user SMB storage authority name (`unas`) in domain
# DNS at this address. Empty skips publication entirely (gate 9).
homelab_storage_address: ""

# ADR 0055: the durable directory accounts a PERSISTENT Controller keeps across
# bring-ups. This names contract ROLES, never accounts: the real account names
# are declared exactly once, in identity/principals.json beside this file, which
# is the same declaration that names the accounts baked onto an installed
# workstation disk. Order is immaterial -- the uidNumber belongs to the role, so
# renaming an account moves no UID and adding a role appends one.
#
# Leave it empty on the disposable acceptance Controller: its roster is
# synthetic, per-run, and staged over the serial console instead.
#
# `local_rescue` is refused outright. It is a LOCAL account at UID 1000 on the
# workstation (ADR 0055, ADR 0063) and must never become a directory principal.
homelab_ad_directory_accounts: []
# - standard_user           # unprivileged directory account
# - daily_administrator     # passworded sudo on the workstation, NOT a Domain
#                           # Admins member -- gate 8 proves that separation
# - domain_administrator    # the Domain Admins member

# Where each new account's initial credential is staged on the Controller, as a
# path template. `{name}` becomes the account's own resolved name. The file is a
# root-owned 0600 regular file with one non-empty first line, and is only needed
# for an account the directory does not have yet -- delete it afterwards. Never
# put the credential itself in this overlay, in Git, or on a command line.
homelab_ad_account_password_file_template: /run/secrets/homelab-ad-{name}

# Staging one, in full. `<name>` is the account's resolved name from
# identity/principals.json -- the role never restates it, and neither should
# you anywhere but here, at the moment of use:
#
#   ssh <controller> 'sudo install -d -m 0700 /run/secrets'
#   ssh <controller> 'sudo install -m 0600 /dev/null /run/secrets/homelab-ad-<name>'
#   ssh <controller> 'sudo tee /run/secrets/homelab-ad-<name> >/dev/null'
#   <type the password, then Ctrl-D>
#   ssh <controller> 'sudo shred -u /run/secrets/homelab-ad-<name>'
#
# Do not put the value on a command line: argv is world-readable in the process
# table. `tee` reads it from your terminal, and the role and its driver only
# ever receive the PATH.

# ADR 0055: enable only once the domain controller exists and answers. Joining
# a machine to a directory that is not ready is how a working machine stops
# being able to log in.
homelab_identity_enabled: false
homelab_identity_domain: <domain>.home.arpa
homelab_identity_realm: <DOMAIN>.HOME.ARPA
homelab_identity_netbios_domain: <DOMAIN>
# Name a controller to take SSSD's login path off SRV discovery. Give the NAME,
# never an address: SSSD warns that an ad_server which is an address breaks
# GSSAPI. Leave it empty on a multi-controller site, where discovery is what you
# want. A live gate-8 run lost a day to this: an Arch workstation joined the
# directory and read its own users out over LDAP while SSSD still could not
# reach a controller, because Samba's own lookups fall back to a broadcast and
# ask a different SRV record than SSSD does.
homelab_identity_domain_controller: <controller>.<domain>.home.arpa
