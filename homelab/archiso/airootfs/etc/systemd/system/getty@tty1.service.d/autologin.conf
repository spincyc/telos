# The physical console gets a root shell without a password, as on the official
# Arch install media. Somebody standing at this machine can already erase its
# disks; a password here would protect nothing and would be one more thing to
# have written down somewhere it should not be.
#
# The installer runs on the serial console (homelab-installer.service). From
# this terminal, run it by name.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear %I 38400 linux
