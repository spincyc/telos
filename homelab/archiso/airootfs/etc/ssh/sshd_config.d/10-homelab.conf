# SSH into the provisioning environment exists for watching an installation
# from another machine, not for performing one: the installer is on the
# console, and ADR 0058 keeps it there.
#
# Keys only. The root account on this image has no password, so permitting
# password authentication would be permitting anonymous root.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
