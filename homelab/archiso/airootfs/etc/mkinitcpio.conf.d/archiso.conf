# Keep this profile aligned with the mkinitcpio contract shipped by Archiso.
# The image is fetched over HTTP, so retain only the PXE transport used by the
# generated iPXE entrypoint. NBD and NFS transports are deliberately absent.
# The UEFI-only image also has no syslinux MEMDISK path, so the memdisk hook
# must not pull its unavailable memdiskfind helper into the initramfs.
HOOKS=(base udev microcode modconf kms archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_http block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
