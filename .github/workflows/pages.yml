name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install site dependency
        run: python -m pip install --disable-pip-version-check -r requirements-site.txt

      # The PDFs in doc/ are tracked artifacts, so Pages publishes exactly the
      # bytes that were reviewed locally. CI never runs pdflatex.
      - name: Check manifest and links
        run: python scripts/site check

      - name: Build site artifact
        run: python scripts/site build

      - name: Verify rendered artifact
        run: python scripts/site verify

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
          include-hidden-files: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
