<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{head_title}}</title>
<meta name="description" content="{{description}}">
<link rel="stylesheet" href="{{root}}assets/site.css">
</head>
<body class="edition fishing {{body_class}}">
<a class="skip" href="#content">Skip to content</a>
<header class="masthead">
  <div class="shell masthead-inner">
    <a class="wordmark" href="{{root}}index.html">{{site_title}}</a>
    <nav aria-label="Primary">
{{navigation}}
    </nav>
  </div>
</header>
<main id="content" class="shell edition-grid">
  <div class="edition-kicker">Field edition · Waukesha County, Wisconsin</div>
  <article>{{content}}</article>
  <aside class="edition-note" aria-label="Field note">
    <strong>Before the first cast</strong>
    <span>Check the current Wisconsin DNR rules for the water and date you fish.</span>
  </aside>
</main>
<footer class="colophon"><div class="shell"><p>Generalized maps are not navigation charts. Regulations change.</p></div></footer>
</body>
</html>
